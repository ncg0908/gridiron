<title>Gridiron Front Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>[hidden]{display:none!important}
/* Layout: phone-first front-office app — sticky team header with yard-hash rule,scrolling card stack,fixed bottom tab bar,bottom sheets for detail */
:root{
  --bg:#E8ECEF; --surface:#FFFFFF; --surface2:#F1F4F6; --ink:#14202B; --muted:#5A6773; --line:#D3DAE0;
  --accent:#1D6B45; --accent-ink:#FFFFFF; --accent-soft:#DCEDE3; --gold:#A8761F; --win:#1D6B45; --loss:#B23A33; --scrim:rgba(10,18,26,.45);
  --po-bg:#0F1822; --po-bg2:#18232F; --po-ink:#F2EADA; --po-mute:#9AA6B2; --po-gold:#E2B44F; --po-line:#3A4A5A;
  --q1:#0B6634; --q2:#2E9A44; --q3:#7EAA16; --q4:#C9A00A; --q5:#E06D16; --q6:#CF3A2E;
  --turf:#2F7A4C; --turf2:#2A7045; --chalk:rgba(255,255,255,.5); --los:#8EC0FF; --fd:#F2CF3A; --leather:#7B4A26;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#152029; --surface2:#1B2833; --ink:#E4EAEF; --muted:#93A1AD; --line:#283845;
  --accent:#43AD76; --accent-ink:#04120A; --accent-soft:#1A3527; --gold:#D8A748; --win:#52C48A; --loss:#E86A61; --scrim:rgba(0,0,0,.6); color-scheme:dark;--q1:#1E9C55; --q2:#4CC466; --q3:#A3CF38; --q4:#EFCB2E; --q5:#F5983A; --q6:#EF5F57;}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#152029; --surface2:#1B2833; --ink:#E4EAEF; --muted:#93A1AD; --line:#283845;
  --accent:#43AD76; --accent-ink:#04120A; --accent-soft:#1A3527; --gold:#D8A748; --win:#52C48A; --loss:#E86A61; --scrim:rgba(0,0,0,.6); color-scheme:dark;--q1:#1E9C55; --q2:#4CC466; --q3:#A3CF38; --q4:#EFCB2E; --q5:#F5983A; --q6:#EF5F57;}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.disp{font-family:var(--display);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:12px;font-weight:700;color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
h2{font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h3{font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted)}
.win{color:var(--win)}
.loss{color:var(--loss)}
/* header */
.top{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:5px}
.top .hbtn .badge{width:32px;height:32px}
.top .caproom .eyebrow{font-size:10px}
.hash{display:none;height:4px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 22px);background-size:100% 6px;background-repeat:no-repeat}
.badge{flex:none;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#FFFFFF;font-size:15px;letter-spacing:.03em}
.badge.sm{width:30px;height:30px;font-size:12px;border-radius:7px}
.badge.lg{width:56px;height:56px;font-size:20px;border-radius:12px}
.tt{flex:1;min-width:0}
.tname{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.005em;text-transform:uppercase;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsub{font-size:12px;line-height:1.2;color:var(--muted)}
.caproom{text-align:right}
.caproom.tovr{text-align:center;padding:0 2px;flex:none}
.top .caproom .num{font-size:16px}
.top .wrap{gap:8px}
.caproom .num{font-size:17px;font-weight:700;line-height:1.1}
.neg{color:var(--loss)}
/* main */
main{padding-bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px;padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.hero{}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{min-height:44px;font-weight:600;font-size:15px;border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--surface2);flex:1 1 auto;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{background:var(--loss);color:#FFFFFF;border-color:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:6px 0}
/* matchup */
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.mu .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mu .nm{font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;line-height:1.05}
.mu .vs{font-family:var(--display);font-weight:800;color:var(--muted);font-size:18px}
.cmp{display:grid;grid-template-columns:36px 1fr 44px 1fr 36px;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.cmp .lab{text-align:center;font-family:var(--display);font-weight:700;color:var(--muted);letter-spacing:.06em;font-size:12px}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.rev{transform:scaleX(-1)}
.bar>i.opp{background:var(--muted)}
/* lists */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:13px;color:var(--muted)}
.fw{position:relative;width:46px;height:46px;flex:none}
.fw svg{width:100%;height:100%;display:block;border-radius:10px}
.fw .pp{position:absolute;right:-5px;bottom:-4px;font-family:var(--display);font-weight:800;font-size:10px;line-height:1;padding:3px 4px;border-radius:5px;background:var(--ink);color:var(--surface);letter-spacing:.03em}
.fw.xl{width:84px;height:84px}
.fw.xl svg{border-radius:16px}
.fw.xl .pp{font-size:13px;padding:4px 6px;right:-6px;bottom:-5px}
.pos{font-family:var(--display);font-weight:700;font-size:13px;background:var(--surface2);border-radius:6px;padding:4px 0;text-align:center;color:var(--muted);letter-spacing:.04em}
.ovr{font-family:var(--display);font-weight:800;font-size:23px;min-width:30px;text-align:center;font-variant-numeric:tabular-nums;line-height:1;display:inline-flex;flex-direction:column;align-items:center}
.sdw{position:relative;display:inline-block}
.ovl{margin-left:4px;color:var(--muted);font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.1em}
.ovl.sh{margin-left:22px}
.nm .ovr.hasd::after{margin-left:22px}
.nm .ovr .sdl{font-size:10px}
.sdl{position:absolute!important;flex-direction:row!important;left:100%;top:-.12em;margin-left:2px;display:flex;align-items:center;gap:2px;font-family:var(--display);font-weight:800;font-size:max(10px,.44em);line-height:1;letter-spacing:0;white-space:nowrap;font-variant-numeric:tabular-nums}
.sdl .sdt{display:block!important;position:static!important;flex:none;width:0!important;height:0!important;margin:0!important;border-left:.36em solid transparent;border-right:.36em solid transparent}
.sdl.sdu .sdt{border-bottom:.62em solid currentColor}
.sdl.sdd .sdt{border-top:.62em solid currentColor}
.sdl .sdn{display:block!important;position:static!important;font:inherit!important;color:inherit!important;margin:0!important}
.bigovr .sdw{margin-right:20px}
.bigovr .sdl{font-size:16px;top:0}

.qb2{background:var(--q2)!important;color:#FFFFFF!important}
.qb3{background:var(--q3)!important;color:#FFFFFF!important}

.deadc{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}

.tb-list{display:flex;flex-direction:column;gap:3px;flex:1;min-height:calc(4*25px + 3*3px)}

.tb-cap{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:8px;padding-top:6px}

.tb-bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}

.adm{display:flex;flex-direction:column;gap:10px}

.btn.st-cont{display:flex;align-items:center;gap:12px;background:var(--tc)!important;box-shadow:0 10px 30px -10px var(--tc)!important;text-transform:none;letter-spacing:0;text-align:left;padding:0 22px}

.st-warn{position:relative;max-width:320px;margin-top:10px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}

.st-splash{position:relative;min-height:calc(100svh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px 0}

.st-logo{position:relative;width:min(220px,52vw);aspect-ratio:1;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));animation:logoin 1s .1s cubic-bezier(.2,1.3,.4,1) both}

.btn.st-go{position:relative;flex:none;margin-top:18px;min-height:56px;padding:0 34px;font-size:18px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#C1272D;color:#FFFFFF;border-color:transparent;box-shadow:0 10px 30px -10px #C1272D;animation:rise .6s .8s both}
.dl-tag{border:0;background:#D7322A;color:#FFFFFF;font:800 11px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;line-height:1.2}
.st-intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;margin-top:4px}

.st-side{width:104px;height:104px;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3))}
.st-side svg{width:100%;height:100%}
.btn.st-rand{width:100%;margin:6px 0 10px;font-weight:700}
.st-seg button{font-size:12.5px;line-height:1.15;white-space:normal}
.tpick.spin{background:color-mix(in srgb,var(--tc) 22%,transparent);box-shadow:inset 4px 0 0 var(--tc);border-radius:10px}
.tpick.landed{background:color-mix(in srgb,var(--tc) 35%,transparent);box-shadow:inset 4px 0 0 var(--tc),0 0 0 2px var(--tc);border-radius:10px;animation:pop .5s both}
/* welcome popup */
.welc{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(5,8,12,.72);animation:spfade .3s ease-out;cursor:pointer}

.welc-lg{width:150px;height:150px;margin:0 auto 10px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.5));animation:logoin 1s .2s cubic-bezier(.2,1.3,.4,1) both}
.welc-lg svg{width:100%;height:100%}
.welc-eb{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
.welc-h{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;text-transform:uppercase;margin-top:6px}
.welc-h b{display:block;font-size:32px;color:var(--tc2)}
.welc-tap{margin-top:16px;font-size:12.5px;opacity:.7}
.tpick{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:max(2px,calc(env(safe-area-inset-bottom,0px) - 14px));z-index:6}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 3px;color:var(--muted);font-family:var(--display);font-weight:700;font-size:12px;line-height:1.1;text-transform:uppercase;letter-spacing:.06em;position:relative}
.tab svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:3px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--loss)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel .badge.logo svg{filter:none}
.sheet-panel{position:relative;background:var(--surface);border-radius:18px 18px 0 0;max-height:88%;overflow-y:auto;padding-top:8px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet-panel .wrap{display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 6px}
@keyframes up{from{transform:translateY(30px);opacity:.6}
to{transform:none;opacity:1}}
.sheet-bg{animation:sbgin .2s ease-out}
@keyframes sbgin{from{opacity:0}}
.sheet.stay .sheet-panel,.sheet.stay .sheet-bg{animation:none}
.sheet.keepbg .sheet-bg{animation:none}
.sheet-panel.under{position:absolute;left:0;right:0;bottom:0;pointer-events:none;animation:none}
.sheet-panel.under[hidden]{display:none}
.sheet:not(.closing) .sheet-panel.out{animation:dnover .18s ease-in forwards!important;pointer-events:none}
.sheet:not(.closing) .sheet-panel.over{animation:upover .24s cubic-bezier(.2,.8,.2,1)!important}
@keyframes upover{from{transform:translateY(100%)}
to{transform:none}}
@keyframes dnover{to{transform:translateY(100%)}}
.sheet.closing .sheet-panel.under{animation:down .16s ease-in forwards}
.sheet.closing{pointer-events:none}
.sheet.closing .sheet-panel{animation:down .16s ease-in forwards}
.sheet.closing .sheet-bg{animation:sbgout .16s ease-in forwards}
@keyframes down{from{transform:none;opacity:1}
to{transform:translateY(60%);opacity:0}}
@keyframes sbgout{to{opacity:0}}

.fr-head{display:flex;gap:14px;align-items:center}
.fr-cups{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.fr-cups span{display:inline-flex;align-items:center;gap:3px;font-family:var(--display);font-weight:800;color:var(--gold);font-size:15px}
.fr-cups svg{width:16px;height:16px}
.yby td.gold b{color:var(--gold)}
.flgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.fl .eyebrow{margin-bottom:4px}
.flr{display:grid;grid-template-columns:14px 30px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;background:none;border:0;padding:5px 0;text-align:left}
.flk{font-family:var(--display);font-weight:700;color:var(--muted);font-size:13px}
.fln{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fln small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.flr b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
/* postseason */
.po-hero{background:var(--po-bg)!important;color:var(--po-ink);border-color:var(--po-line)!important}
.po-hero.po-aw{border-color:var(--po-gold)!important;box-shadow:0 0 0 1px var(--po-gold) inset,0 10px 30px -18px var(--po-gold)}
.po-hero.po-gb{border:2px solid transparent!important;background:linear-gradient(var(--po-bg),var(--po-bg)) padding-box,linear-gradient(90deg,var(--gl) 50%,var(--gr) 50%) border-box!important}
.po-hero .eyebrow{color:var(--po-gold)}
.po-hero .muted{color:var(--po-mute)}
.po-hero h2{letter-spacing:.02em}
.btns.col{flex-direction:column;align-items:stretch}
.btns.col .btn{flex:none;width:100%;white-space:normal}
.poh{display:flex;align-items:center;justify-content:space-between;gap:14px}
.poh>div{min-width:0}
.poh>.badge{flex:none}
.btn.big{min-height:56px;font-size:18px}
.po-hero .btn{background:var(--po-bg2);color:var(--po-ink);border-color:var(--po-line)}
.po-hero .btn.primary{background:var(--po-gold);color:var(--po-bg);border-color:transparent}
.po-card{background:var(--po-bg);color:var(--po-ink);border-color:var(--po-line)}
/* postseason wears the user's team color; only Honors Night stays gold */
.po-card,.po-hero:not(.po-aw){--po-gold:var(--po-acc,#E2B44F)}
.po-hero:not(.po-aw) .btn.primary{color:var(--po-acc-ink,#0F1822)!important}
.po-card .eyebrow{color:var(--po-gold)}
.bracket{display:flex;flex-direction:column}
.mt.bye .sc{font-size:10px!important;letter-spacing:.08em;color:var(--po-mute)}
.mt{display:flex;flex-direction:column;background:var(--po-bg2);border:1px solid var(--po-line);border-radius:10px;overflow:hidden;width:100%;padding:0;text-align:left;color:inherit}
.mt.up{border-style:dashed}
.ms{display:grid;grid-template-columns:10px 26px minmax(0,1fr) auto;align-items:center;gap:6px;padding:6px 7px;font-size:13.5px}
.ms .badge.sm{width:26px;height:26px;font-size:10px;border-radius:6px}
.ms+.ms{border-top:1px solid var(--po-line)}
.ms .sd{font-family:var(--display);font-weight:700;font-size:12px;color:var(--po-mute);text-align:center}
.ms .tn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms .sc{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.ms.bw{background:linear-gradient(90deg,color-mix(in srgb,var(--po-gold) 18%,transparent),transparent 70%);box-shadow:inset 3px 0 0 var(--po-gold)}
.ms.bw .sc{color:var(--po-gold)}
.ms.bl{opacity:.42;filter:grayscale(1)}
.ms.bl .tn{text-decoration:line-through;text-decoration-color:var(--po-mute)}
.ms.me .tn{color:var(--po-gold);font-weight:800}
.ms.tbd .tn{color:var(--po-mute);font-style:italic;font-weight:500}
.ms.tbd{min-height:39px}
.ms.elim{animation:elim 1.5s .5s both}
.ms.arrive{animation:arrive 1s 1.5s both}
.ms.crown{animation:crown 2.4s .6s both}
@keyframes elim{0%{opacity:1;filter:none}
12%{transform:translateX(-4px)}
24%{transform:translateX(4px)}
36%{transform:translateX(-3px)}
48%{transform:none;opacity:1;filter:none}
100%{opacity:.42;filter:grayscale(1)}}
@keyframes arrive{0%{opacity:0;transform:translateX(-28px) scale(.92)}
60%{opacity:1;transform:translateX(3px) scale(1.02);box-shadow:inset 3px 0 0 var(--po-gold),0 0 0 2px var(--po-gold)}
100%{transform:none;box-shadow:inset 0 0 0 transparent}}
@keyframes crown{0%,100%{box-shadow:inset 3px 0 0 var(--po-gold)}
30%{box-shadow:inset 3px 0 0 var(--po-gold),0 0 22px 2px var(--po-gold);transform:scale(1.03)}}
@keyframes pulse{0%,100%{opacity:1}
50%{opacity:.25}}
.trophy{width:24px;height:24px;fill:none;stroke:var(--po-gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mt.cupm{max-width:300px;border-color:var(--po-gold);box-shadow:0 0 24px -10px var(--po-gold)}
/* hall of fame */
.hofm{display:flex;flex-direction:column;align-items:center;margin-left:auto}
.hofrow2{display:flex;align-items:center;gap:6px;margin-top:4px}
.hofr{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--v)*1%),var(--line) 0)}
.hofr i{width:35px;height:35px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:14px;line-height:1}
.hofr i small{font-size:8px}
.hofl{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.hofy{margin-top:10px}
.hofy .eyebrow{color:var(--gold)}
.hofrow{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;color:inherit}
.hofst{width:46px;height:58px;border-radius:8px;background:linear-gradient(#2A2F38,#12151A);overflow:hidden;display:block}
.hofst svg,.hofbig svg,.hofstat svg{width:100%;height:100%;display:block}
.hofhl{color:var(--ink)!important;font-weight:500;margin-top:2px}
.hofhead{display:flex;gap:16px;align-items:center}
.hofbig{width:84px;height:106px;flex:none;border-radius:12px;background:linear-gradient(#2A2F38,#12151A);overflow:hidden;display:block}
.hofgold{color:var(--gold)!important}
.hofstage{position:relative;height:340px;margin:10px auto 4px;width:min(100%,280px)}
.hofspot{position:absolute;inset:-30px -40px 30px;background:radial-gradient(ellipse at 50% 30%,rgba(255,236,190,.28),transparent 62%);opacity:.35;transition:opacity 1.2s}
.hofstage.rev .hofspot{opacity:1}
.hofstat{position:absolute;left:8%;right:8%;top:0;bottom:62px}
.hofstage.rev .hofstat{animation:hofglow 2.4s .9s both}
.hofped{position:absolute;left:12%;right:12%;bottom:0;height:62px;background:linear-gradient(#3B4048,#1C1F25);border-top:4px solid #8C939E;border-radius:4px;display:grid;place-items:center}
.hofped span{background:linear-gradient(#F3D58A,#B98A2E);color:#2B1D08;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;padding:5px 10px;border-radius:3px;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hofcloth{position:absolute;left:2%;right:2%;top:-8px;height:calc(100% - 54px);width:96%;transform-origin:85% 0;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
.hofstage:not(.rev) .hofcloth{animation:hofsway 3s ease-in-out infinite}
.hofstage.rev .hofcloth{animation:hofpull 1.3s cubic-bezier(.5,0,.3,1) both;pointer-events:none}
@keyframes hofsway{0%,100%{transform:skewX(0)}
50%{transform:skewX(-1.2deg)}}
@keyframes hofpull{0%{transform:none}
22%{transform:translateY(-3%) scaleY(.97) skewX(-4deg)}
100%{transform:translate(85%,-115%) rotate(38deg) scale(.6);opacity:0}}
@keyframes hofglow{0%{filter:drop-shadow(0 0 0 transparent)}
40%{filter:drop-shadow(0 0 26px rgba(242,206,120,.9))}
100%{filter:drop-shadow(0 0 10px rgba(242,206,120,.35))}}
.hofhl2{text-align:center;margin:6px 0 4px;animation:rise .6s 1.1s both}
@media (prefers-reduced-motion: reduce){.hofcloth,.hofstat{animation:none!important}
.hofstage.rev .hofcloth{display:none}}
/* gridiron wire */

100%{transform:translate(var(--sw),230px) rotate(540deg)}}

.nw-h{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.08;text-transform:uppercase}
.nw-d{font-size:13.5px;color:var(--muted);line-height:1.3}
.nw-quick ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.ar-hero{height:150px;margin:-4px -4px 12px;border-radius:14px;background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 35%,#0A0D12));display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.ar-hero .sa-face{width:140px;height:140px;position:relative}
.ar-hero .sa-face svg{width:100%;height:100%}
.ar-hero .sa-face>svg rect:first-of-type{fill:transparent}
.ar-hero .sa-tl{position:absolute;right:-34px;bottom:10px;width:50px;height:50px}
.ar-hero .sa-tl svg{width:100%;height:100%}
.ar-hero .sa-logo{width:110px;height:110px;align-self:center}
.ar-hero .sa-logo svg{width:100%;height:100%}
.ar-hero .sa-tr{align-self:center;display:flex;align-items:center;gap:12px}
.ar-hero .sa-tr span{width:84px;height:84px;display:block}
.ar-hero .sa-tr svg{width:100%;height:100%}
.ar-hero .sa-tr i{font-style:normal;color:#FFFFFF;font-family:var(--display);font-weight:800;font-size:20px}
.ar-h{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.02;text-transform:uppercase;margin:8px 0 6px}
.ar-dek{font-size:16px;margin:0 0 8px;line-height:1.35}
.ar-by{font-size:12.5px;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line)}
.ar-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-top:12px}
.ar-facts div{background:var(--surface2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ar-facts span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ar-facts b{font-family:var(--display);font-size:17px;line-height:1.1;overflow-wrap:anywhere}
.ar-body p{font-size:16px;line-height:1.55;margin:12px 0}
.ar-body blockquote{margin:16px 0;padding:4px 0 4px 14px;border-left:4px solid var(--accent);font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2}
.ar-body cite{display:block;margin-top:6px;font-family:var(--body);font-style:normal;font-weight:500;font-size:12.5px;color:var(--muted)}
.ar-fans{background:var(--surface2);border-radius:14px;padding:12px 14px;margin-top:8px}
.ar-mood{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.ar-mood.mu{color:var(--accent)}
.ar-mood.md{color:var(--loss)}
.ar-mood.mn{color:var(--muted)}
.ar-meter{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--loss),var(--line),var(--accent));position:relative;margin-bottom:10px}
.ar-meter i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--surface);transform:translateX(-50%)}
.ar-post{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ar-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF;font-family:var(--display);font-weight:800;font-size:14px}
.ar-post b{font-size:13px}
.ar-post p{margin:2px 0;font-size:14.5px}
.ar-post small{font-size:12px;color:var(--muted)}
.ar-pk{display:grid;grid-template-columns:22px 30px minmax(0,1fr) 40px;gap:8px;align-items:center;width:100%;padding:8px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:inherit}
.ar-pk.me{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ar-n{font-family:var(--display);font-weight:800;color:var(--muted);font-size:15px}
.ar-pn{display:flex;flex-direction:column;min-width:0}
.ar-pn b{font-size:14.5px}
.ar-pn small{font-size:12px;color:var(--muted)}
.ar-pn .ar-note{color:var(--ink);opacity:.8}
.ar-g{font-family:var(--display);font-weight:800;font-size:18px;text-align:center;border-radius:8px;padding:4px 0;background:var(--surface2)}
.ar-g.gA{background:var(--accent);color:var(--accent-ink)}
.ar-g.gB{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.ar-g.gC{background:color-mix(in srgb,var(--gold) 25%,transparent);color:var(--gold)}
.ar-g.gD,.ar-g.gF{background:var(--loss);color:#FFFFFF}
.pill.t-awards{background:var(--gold);color:#FFFFFF}
/* gridiron's choice */
.gc{border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% -20%,#2C3A52,#0B0F17 70%);color:#F2EADA;padding:14px 12px 12px;box-shadow:0 0 0 1px rgba(226,180,79,.45) inset,0 14px 30px -18px rgba(0,0,0,.6);position:relative}
.gc::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,transparent 0 26px,rgba(226,180,79,.05) 26px 30px);pointer-events:none}
.gc-h{display:flex;justify-content:space-between;align-items:baseline;position:relative}
.gc-k{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:.07em;white-space:nowrap}
.gc-k b{color:#E2B44F}
.gc-w{text-align:right;margin-left:8px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#A9B3C4}
.gc-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 2px;position:relative}
.gc-cols span{text-align:center;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.2em;color:#E2B44F;border-bottom:1px solid rgba(226,180,79,.35);padding-bottom:4px}
.gc-cat{display:flex;align-items:center;gap:8px;margin:10px 0 6px;position:relative}
.gc-cat span{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A9B3C4;margin:0 auto}
.gc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.gc-cell{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 6px 10px;border-radius:14px;border:0;color:inherit;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 55%,transparent),rgba(255,255,255,.04) 70%);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;min-width:0}
.gc-face{position:relative;width:66px;height:66px;display:block;margin-bottom:4px}
.gc-face>svg{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 2px #E2B44F;display:block}
.gc-face>svg rect:first-of-type{fill:#1B2433}
.gc-lg{position:absolute;right:-8px;bottom:-4px;width:28px;height:28px}
.gc-lg svg{width:100%;height:100%}
.gc-n{font-family:var(--display);font-weight:800;font-size:15px;line-height:1.05;text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-m{font-size:11px;color:#A9B3C4;letter-spacing:.04em}
.gc-s{font-size:12px;font-weight:600;color:#F6D98A;line-height:1.25;margin-top:2px}
.gc-empty{align-items:center;justify-content:center;color:#6B7586;min-height:60px;font-size:12px}
.tseg button{color:var(--tc);font-weight:700}
.tseg button.on{background:var(--tc);color:#FFFFFF}
/* live broadcast */
#live{--lv-bg:#0A1017;--lv-s:#121B25;--lv-s2:#1A2531;--lv-ink:#EEF2F6;--lv-mut:#8C9AA8;--lv-line:#25313E;background:var(--lv-bg)!important;color:var(--lv-ink)}
#live .lv-body,#live .lv-tabs{background:var(--lv-bg);color:var(--lv-ink)}
.live .lv-bar{background:var(--lv-bg);border-bottom:1px solid var(--lv-line)}
.lv-bar .wrap{display:flex;gap:8px;align-items:center;padding-block:8px}
.lvb,#live .lvb{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--lv-line);background:var(--lv-s);color:var(--lv-ink);font:700 13px var(--body)}
.lvb.hot,#live .lvb.hot{background:var(--lv-acc,#E2B44F);color:var(--lv-acci,#1A1405);border-color:transparent}
.lv-sp{flex:1;display:flex;background:var(--lv-s);border-radius:10px;padding:3px;gap:3px;border:1px solid var(--lv-line)}
.lv-sp button{flex:1;min-height:30px;border:0;border-radius:8px;background:none;color:var(--lv-mut);display:grid;place-items:center}
.lv-sp button.on{background:var(--lv-s2);color:var(--lv-acc,#E2B44F)}
.lv-sp .spi{fill:currentColor}
.lv-top{position:relative}
.live .board{background:linear-gradient(180deg,#0E1720,var(--lv-bg));color:var(--lv-ink)}
.live .board .wrap{padding-block:10px 10px}
.bug{display:grid;grid-template-columns:1fr auto 1fr;border-radius:12px;overflow:hidden;box-shadow:0 8px 20px -10px #000,0 0 0 1px rgba(255,255,255,.06)}
.bug-t{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 92%,#000),var(--tc));min-width:0}
.bug-t.r{flex-direction:row-reverse;background:linear-gradient(260deg,color-mix(in srgb,var(--tc) 92%,#000),var(--tc))}
.bug-t .badge{width:34px;height:34px}
.bug-n{display:flex;flex-direction:column;line-height:1;min-width:0}
.bug-t.r .bug-n{text-align:right}
.bug-n b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em;color:#FFFFFF}
.bug-n small{font-size:10.5px;color:rgba(255,255,255,.75);margin-top:2px}
.bug-s{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:#FFFFFF;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.bug-s.pop{animation:scorepop .9s cubic-bezier(.2,.9,.3,1.4)}
@keyframes scorepop{0%{transform:scale(1)}
30%{transform:scale(1.55);color:#F6D98A}
100%{transform:scale(1)}}
.bug-gap{flex:1;display:flex;align-items:center;justify-content:center;align-self:stretch}
.bug-poss{display:block;width:16px;height:10px;border-radius:50%;background:#8B4A22;border:1.5px solid #FFFFFF}
.bug-c{background:#05080C;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 12px;min-width:66px}
.bug-c b{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.06em;color:#FFFFFF}
.bug-c small{font-family:var(--display);font-weight:700;font-size:17px;color:#FFFFFF;font-variant-numeric:tabular-nums}
.bug-dd{margin:8px auto 0;width:max-content;max-width:100%;padding:4px 14px;border-radius:999px;background:var(--lv-acc,#E2B44F);color:var(--lv-acci,#1A1405);font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fld{position:relative;height:104px;margin-top:10px;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(90deg,#2E7D48 0 4.1667%,#2A7342 4.1667% 8.3333%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.fl-ez{position:absolute;top:0;bottom:0;width:8.333%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 0;overflow:hidden;background:repeating-linear-gradient(135deg,var(--ec) 0 7px,color-mix(in srgb,var(--ec) 78%,var(--ec2)) 7px 12px);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ec2) 80%,transparent)}
.fl-ezl.fl-ezg{width:min(56%,13px)}
.fl-ezl.fl-ezg.fl-ezc{width:min(70%,17px)}
.fl-ezl{flex:none;width:min(66%,18px);aspect-ratio:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.fl-ezl svg{width:100%;height:100%;display:block}
.fl-ez.l{flex-direction:column-reverse}
.fl-ez.l .fl-ezl{transform:rotate(-90deg)}
.fl-ez.r .fl-ezl{transform:rotate(90deg)}
.fl-ez span{writing-mode:vertical-rl;font-family:var(--display);font-weight:800;letter-spacing:.08em;line-height:1;color:#FFFFFF;text-transform:uppercase;opacity:.7;white-space:nowrap;overflow:hidden}
.fl-ez.l{left:0}
.fl-ez.l span{transform:rotate(180deg)}
.fl-ez.r{right:0}
.fl-mid{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;opacity:.35}
.fl-mid svg{width:100%;height:100%}
.fl-lines{position:absolute;inset:0 8.333%;border-right:1px solid rgba(255,255,255,.55);background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 1px,transparent 1px 10%),linear-gradient(transparent 32%,rgba(255,255,255,.35) 32% 33%,transparent 33% 67%,rgba(255,255,255,.35) 67% 68%,transparent 68%)}
.fl-nums{position:absolute;left:8.333%;right:8.333%;display:flex;justify-content:space-around;color:rgba(255,255,255,.7);font-family:var(--display);font-weight:800;font-size:11px;padding:0 4%}
.fl-nums.t{top:3px}
.fl-nums.b{bottom:3px}
.fl-drive{position:absolute;top:40%;height:20%;opacity:.55;border-radius:3px;transition:all .4s ease}
.fl-ln{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;transition:left .45s ease}
.fl-ln.los{background:#4EA3FF}
.fl-ln.fd{background:#FFD83A;box-shadow:0 0 6px #FFD83A}
.fl-ball{position:absolute;top:50%;width:18px;height:11px;margin:-5.5px 0 0 -9px;border-radius:50%;background:#7B3F1C;border:1.5px solid #FFFFFF;box-shadow:0 2px 3px rgba(0,0,0,.4);transition:left .55s cubic-bezier(.3,.8,.3,1);z-index:2}
.fl-ball.mv{animation:ballhop .55s ease-out}
@keyframes ballhop{0%{transform:translateY(0)}
45%{transform:translateY(-14px) rotate(20deg)}
100%{transform:translateY(0)}}
.fl-arrow{position:absolute;top:47%;height:6%;border-radius:3px;animation:arrowfade 1.6s ease-out forwards}
.fl-arrow.up{background:#7CFF9B}
.fl-arrow.dn{background:#FF6B6B}
@keyframes arrowfade{0%{opacity:0;transform:scaleX(.2)}
20%{opacity:.95;transform:none}
100%{opacity:0}}
.fl-arrow.rt{transform-origin:left}
.fl-arrow.lt{transform-origin:right}
.wpb{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-top:8px;font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.04em}
.wpb>span{color:#E7ECF1!important;display:flex;align-items:center;gap:5px}
.wpb>span i{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px rgba(255,255,255,.5)}
.wp-ch{position:relative;height:30px}
.wp-ch svg{position:absolute;inset:0 0 6px;width:100%;height:24px;overflow:visible}
.wp-mid{stroke:rgba(255,255,255,.2);stroke-width:.6;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
.wp-ln{fill:none;stroke:#F6D98A;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.wp-bar{position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:3px;overflow:hidden;display:flex;gap:2px}
.wp-bar i{display:block;height:100%;transition:width .5s}
.lv-mo{position:absolute;inset:0;pointer-events:none;z-index:5;display:flex;align-items:center;justify-content:center}
.mo{display:flex;align-items:center;gap:12px;padding:12px 18px 12px 12px;border-radius:16px;background:linear-gradient(110deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#000));box-shadow:0 0 0 2px var(--tc2),0 20px 40px -10px #000;animation:moin 2.4s cubic-bezier(.2,.9,.3,1.2) forwards;max-width:92%}
.mo.sp2{animation-duration:1.3s}
.mo.sp3{animation-duration:.8s}
.mo.mo-sm{padding:8px 14px 8px 8px}
.mo.mo-sm b{font-size:24px}
.mo-f,.mo-l{width:64px;height:64px;flex:none;border-radius:50%;overflow:hidden;display:block;box-shadow:0 0 0 2px var(--tc2)}
.mo-f svg,.mo-l svg{width:100%;height:100%;display:block}
.mo.mo-sm .mo-f,.mo.mo-sm .mo-l{width:46px;height:46px}
.mo-t{display:flex;flex-direction:column;color:#FFFFFF;min-width:0;flex:none;max-width:calc(100vw - 120px)}
.mo-t b{white-space:nowrap;padding:0 .14em .04em 0;font-family:var(--display);font-weight:800;font-size:36px;line-height:1.02;letter-spacing:.04em;font-style:italic;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.mo-t span{font-size:12.5px;font-weight:600;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes moin{0%{opacity:0;transform:scale(.4) rotate(-6deg)}
12%{opacity:1;transform:scale(1.08) rotate(1deg)}
20%{transform:scale(1)}
80%{opacity:1;transform:scale(1)}
100%{opacity:0;transform:scale(.95) translateY(-10px)}}
.live .lv-tabs{background:var(--lv-bg)}
.lv-sg{display:flex;background:var(--lv-s);border-radius:10px;padding:3px;gap:3px;border:1px solid var(--lv-line)}
.lv-sg button{flex:1;min-height:34px;border:0;border-radius:8px;background:none;color:var(--lv-mut);font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.lv-sg button.on{background:var(--lv-s2);color:var(--lv-ink)}
.dr-h{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:14px;padding:8px 10px;border-radius:10px;background:var(--lv-s);border-left:4px solid var(--tc)}
.dr-h.now{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 35%,var(--lv-s)),var(--lv-s))}
.dr-h b{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;display:block}
.dr-h small{font-size:12px;color:var(--lv-mut)}
.dr-r{font-family:var(--display);font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--lv-s2);color:var(--lv-mut)}
.dr-r.sc{background:var(--lv-acc,#E2B44F);color:var(--lv-acci,#1A1405)}
.dr-r.to{background:#C2413A;color:#FFFFFF}
.pl2{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--lv-line);font-size:14px}
.pl2.nt{grid-template-columns:1fr;text-align:center;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--lv-mut)}
.pl2.nt.inj{color:#FF8A80}
.pl2.big{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 40%,transparent),transparent);border-radius:10px;border-bottom-color:transparent;padding:10px 8px;margin:4px 0}
.pl2.to .pl2-t{color:#FF8A80;font-weight:600}
.pl2.new{animation:fadein .4s ease-out}
.pt{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:4px 0;border-radius:6px;background:var(--lv-s2);color:var(--lv-mut)}
.pt-pass{color:#8EC5FF}
.pt-run{color:#9BE7A6}
.pt-sack{color:#FFB37A}
.pt-int,.pt-fum{background:#C2413A;color:#FFFFFF}
.pt-td{background:var(--lv-acc,#E2B44F);color:var(--lv-acci,#1A1405)}
.pt-fg{background:#3C8D5C;color:#FFFFFF}
.pt-miss{color:#FF8A80}
.pt-punt{color:#C5CCD4}
.pl2-w{font-size:11.5px;color:var(--lv-mut);font-family:var(--display);font-weight:700;letter-spacing:.04em}
.pl2-t{line-height:1.35}
.pl2-s{margin-top:4px;font-family:var(--display);font-weight:800;font-size:15px;color:#F6D98A}
.pg{font-family:var(--display);font-weight:800;font-size:15px;color:var(--lv-mut);font-variant-numeric:tabular-nums}
.pg.up{color:#7CDB91}
.pg.dn{color:#FF8A80}
.fl-pog{position:absolute;inset:8px 10px;display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:center;padding:8px 12px;border-radius:12px;border:0;text-align:left;color:#FFFFFF;
  background:linear-gradient(110deg,color-mix(in srgb,var(--tc) 92%,#000),color-mix(in srgb,var(--tc) 45%,#05080C));box-shadow:0 0 0 2px var(--lv-acc,#E2B44F),0 12px 26px -10px #000;animation:pogin .7s cubic-bezier(.2,.9,.3,1.25) both;z-index:3}
.fl-pog.still{animation:none}
.fl-pog .lv-pogf{width:62px;height:62px}
.fl-pk{font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#F6D98A}
.fl-pog b{display:block;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;text-transform:uppercase}
.fl-pog small{display:block;font-size:12px;opacity:.88;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

100%{opacity:1;transform:none}}

.pm.fresh .badge{animation:pop .8s 1.9s both}
.pm.fresh .pm-h{animation:slam .7s 2.1s both}

.itm{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:54px}
.itm small{font-size:11.5px;color:var(--muted);font-weight:600}
.hbtn{background:none;border:0;padding:0;line-height:0}
.asset{display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;line-height:1.15}
.asset small{display:block;color:var(--muted);font-size:11.5px}
.asset-p{color:inherit;font:inherit;font-size:13px;text-align:left;cursor:pointer}
.asset-p b .sdl{font-size:9px}
.assets{display:flex;flex-wrap:wrap;gap:6px}
.pkb{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--surface);font-family:var(--display);font-weight:800;font-size:13px}
.pkb.big{width:40px;height:40px;font-size:16px}
.blk{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.blk:first-of-type{border-top:0}
.offerc{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px}
.prow{grid-template-columns:24px 30px minmax(0,1fr) auto!important}
.txr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;width:100%;padding:10px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.txr:first-child{border-top:0}
.txl{display:flex;gap:2px}
.txr .txt{font-size:14px}
.plab{display:inline-block;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;vertical-align:1px;background:var(--surface2);color:var(--muted)}
.plab.generational{background:var(--q1);color:#FFFFFF}
.plab.franchise{background:var(--q2);color:#FFFFFF}
.plab.elite{background:var(--q3);color:#FFFFFF}
.plab.starter{background:var(--q4);color:#1A1405}
.plab.bench{background:var(--q6);color:#FFFFFF}
.btn.xs{min-height:30px;padding:4px 12px;font-size:13px;flex:none}
.capline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:14px}
.capn{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.capn b{color:var(--ink);font-size:14px}
.drow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 2px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.drow:first-child{border-top:0}
.drow .nm{font-weight:600}
.drow .meta{font-size:13px;color:var(--muted)}
.dovr{display:flex;flex-direction:column;align-items:center;line-height:1}
.dovr b{font-family:var(--display);font-size:26px;font-weight:800}
.dovr span{font-size:10px;letter-spacing:.1em;color:var(--muted);font-family:var(--display);font-weight:700}
.rkmini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rkmini div{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;background:var(--surface2);border-radius:8px;padding:6px 8px}
.rkmini span{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.rkmini b{font-family:var(--display);font-size:18px}
.rkmini small{font-size:11px;color:var(--muted);flex-basis:100%}
.drow.dcls.me{background:var(--accent-soft);border-radius:10px;margin:0 -10px;padding-left:10px;padding-right:10px;width:calc(100% + 20px);border-top-color:transparent}
.drow.dcls.me+.drow{border-top-color:transparent}
.drow.dcls .badge{width:40px;height:40px}
.drow.d10{grid-template-columns:18px 46px minmax(0,1fr) auto;gap:6px;padding-left:0}
.drow.d10>div:not(.dovr){padding-left:5px}
.drow .bn{font-family:var(--display);font-weight:800;color:var(--muted);text-align:left;letter-spacing:-.03em}
.story2.trade .pill{justify-self:start}
.story2.trade{grid-template-columns:1fr;gap:0;align-items:start}
.tg{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);align-items:start;gap:6px;width:100%}
.tgs{display:flex;flex-direction:column;gap:5px;min-width:0}
.tgl{width:40px;height:40px;display:block}
.tgl svg{width:100%;height:100%}
.tgn{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;line-height:1}
.tgi{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.1;min-width:0}
.tgi small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgi b{font-family:var(--display);font-size:16px}
.tgf{width:30px;height:30px;flex:none}
.tgf svg{width:100%;height:100%;border-radius:7px;display:block}
.tgi .pkb{width:30px;height:30px;font-size:12px;flex:none}
.tgm{font-size:12px;color:var(--muted)}
.tgx{align-self:center;color:var(--muted)}
.tgx svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.poshd{display:flex;align-items:baseline;gap:8px;padding:12px 2px 4px;border-top:1px solid var(--line)}
.poshd:first-child{border-top:0;padding-top:2px}
.poshd b{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em}
.poshd span{font-size:12px;color:var(--muted)}
.poshd.short span,.poshd.short b{color:var(--loss)}
.poshd+.row{border-top:0}
.stories{display:flex;flex-direction:column}
.story2{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.story2:first-child{border-top:0;padding-top:4px}
.story2 .sb{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.story2 .sh{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.08;text-transform:uppercase}
.story2 .muted{font-size:13.5px}
.story2.major .sh{font-size:21px}
.sm{position:relative;width:64px;height:64px}
.pill.t-trade{background:var(--accent);color:var(--accent-ink)}
.pill.t-injury{background:var(--loss);color:#FFFFFF}
.pill.t-suspension{background:var(--gold);color:#FFFFFF}
.pill.t-champions,.pill.t-record{background:var(--gold);color:#FFFFFF}
.pill.t-hot-seat,.pill.t-skid{background:var(--loss);color:#FFFFFF}
.pill.t-comeback,.pill.t-upset,.pill.t-streak,.pill.t-draft{background:var(--accent);color:var(--accent-ink)}
.pill.t-coaching-change,.pill.t-new-coach{background:var(--ink);color:var(--surface)}
.pill.t-retirement,.pill.t-conference-champs{background:var(--gold);color:#FFFFFF}
.pill.t-signing,.pill.t-free-agency,.pill.t-trade-request{background:var(--ink);color:var(--surface)}
.aw-ovr{position:relative;font-family:var(--display);font-weight:800;font-size:.95em;padding:0 2px;vertical-align:0}
.aw-ovr.boost{animation:awboost .9s .35s both}
@keyframes awboost{0%{filter:brightness(1);transform:scale(1)}
35%{filter:brightness(1.8) drop-shadow(0 0 8px rgba(255,236,170,.9));transform:scale(1.25)}
100%{filter:none;transform:scale(1)}}
.aw-pop{position:absolute;z-index:6;left:50%;top:-4px;transform:translateX(-50%);font-size:.8em;color:#7CE38B;text-shadow:0 0 8px rgba(63,185,80,.8);pointer-events:none;animation:awpop 1.6s .3s ease-out both}
.aw-pop.w{color:#F7DE8E;text-shadow:0 0 10px rgba(247,222,142,.9),0 0 2px #000;font-size:1.15em;animation-duration:2.2s;animation-delay:.6s}
#aw .aw-c.won .aw-ovr.boost{animation-delay:.7s}
#aw .aw-rib{right:auto;left:14px}
@keyframes awpop{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}
20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}
70%{opacity:1;transform:translate(-50%,-18px) scale(1)}
100%{opacity:0;transform:translate(-50%,-30px) scale(.9)}}
.aw-pos{display:inline-block;font-family:var(--display);font-weight:800;font-size:.62em;letter-spacing:.06em;padding:2px 6px;margin-right:7px;border-radius:5px;background:#E2B44F;color:#1A1405;vertical-align:3px}
.covtease{display:flex;flex-direction:column;gap:2px;align-items:flex-start;width:100%;text-align:left;padding:16px;border-radius:14px;border:0;background:linear-gradient(120deg,var(--po-bg),#2A3A50);color:var(--po-ink);position:relative;overflow:hidden}
.covtease::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(226,180,79,.08) 18px 22px)}
.ct-eb{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--po-gold)}
.ct-h{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1.05}
.ct-sub{font-size:13px;color:var(--po-mute)}
.dlalert{background:linear-gradient(120deg,#3A1414,#6E1F1F)}
.dlalert::after{background:repeating-linear-gradient(115deg,transparent 0 18px,rgba(255,120,90,.1) 18px 22px)}
.dlalert .ct-eb{color:#FFB199}
.covmini{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;width:100%}
.covmini .nm{font-weight:700}
.cov{position:fixed;inset:0;z-index:27;overflow-y:auto;background:radial-gradient(ellipse at 50% 0%,#1E2836,#05080C 70%);color:#F2EADA;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cov-in{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:stretch}
.cov-box{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,var(--c1) 0%,var(--c1) 45%,#0A0D12 100%);box-shadow:0 30px 60px -20px #000,0 0 0 2px rgba(255,255,255,.12);animation:covin 1s cubic-bezier(.2,.8,.2,1) both}
.cov-stripes{position:absolute;inset:-20%;background:repeating-linear-gradient(118deg,transparent 0 34px,color-mix(in srgb,var(--c2) 22%,transparent) 34px 46px);transform:translateX(8%)}
.cov-title{position:absolute;left:0;right:0;top:4%;text-align:center;font-family:var(--display);line-height:.85;z-index:2}
.cov-title span{display:block;font-weight:800;font-size:40px;letter-spacing:.12em;color:#FFFFFF;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.cov-title b{display:block;font-weight:800;font-size:64px;color:var(--c2);text-shadow:0 3px 0 rgba(0,0,0,.4)}
.cov-face{position:absolute;left:0;right:0;bottom:3%;top:22%;z-index:1;filter:drop-shadow(0 18px 24px rgba(0,0,0,.55));animation:covface 1.2s .3s cubic-bezier(.2,.8,.2,1) both}
.cov-face svg{width:100%;height:100%}
.cov-face svg rect:first-of-type{fill:transparent}
.cov-logo{position:absolute;right:5%;top:30%;width:22%;z-index:2;opacity:.95}
.cov-logo svg{width:100%;height:auto;display:block}
.cov-name{position:absolute;left:5%;right:5%;bottom:7%;z-index:3;font-family:var(--display);font-weight:800;font-size:30px;line-height:.95;text-transform:uppercase;color:#FFFFFF;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.cov-name small{display:block;font-size:13px;letter-spacing:.12em;color:var(--c2);margin-bottom:4px}
.cov-ovr{position:absolute;left:5%;top:30%;z-index:3;width:56px;padding:6px 0;text-align:center;background:#0A0D12;border:2px solid var(--c2);border-radius:8px;font-family:var(--display);line-height:1}
.cov-ovr b{display:block;font-size:26px;color:#FFFFFF}
.cov-ovr span{font-size:10px;letter-spacing:.12em;color:#FFFFFF}
.cov-foot{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:6px;text-align:center;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.24em;background:#0A0D12;color:#FFFFFF}
/* ---- cover v2 ---- */
.cvx{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:#05070B;box-shadow:0 30px 60px -20px #000,0 0 0 1px rgba(255,255,255,.14);animation:covin 1s cubic-bezier(.2,.8,.2,1) both;isolation:isolate}
.cvx-fx{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.cvx-wm{position:absolute;left:50%;top:50%;width:120%;transform:translate(-50%,-50%) rotate(-8deg);opacity:.16;z-index:1;mix-blend-mode:screen}
.cvx-wm svg{width:100%;height:auto;display:block}
.cvx-num{position:absolute;right:-4%;top:14%;font:900 210px/0.8 var(--display);color:transparent;-webkit-text-stroke:3px color-mix(in srgb,var(--c2) 70%,transparent);opacity:.55;z-index:1;letter-spacing:-.04em}
.cvx-art{position:absolute;left:2%;right:2%;bottom:-1%;top:27%;z-index:2;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--c2) 70%,transparent)) drop-shadow(0 22px 26px rgba(0,0,0,.6));animation:covface 1.2s .3s cubic-bezier(.2,.8,.2,1) both}
.cvx-art svg{width:100%;height:100%}
.cvx-art svg>ellipse:first-of-type{opacity:.35}
.cvx-title{position:absolute;left:0;right:0;top:3.5%;text-align:center;z-index:3;font-family:var(--display);line-height:.82;font-weight:900}
.cvx-title span{display:block;font-size:44px;letter-spacing:.1em;color:#FFFFFF;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.35)}
.cvx-title b{display:block;font-size:74px;color:var(--c2);-webkit-text-stroke:2px rgba(0,0,0,.35);text-shadow:0 4px 0 rgba(0,0,0,.35)}
.cvx-badges{position:absolute;left:4%;right:4%;bottom:3.5%;display:flex;justify-content:space-between;align-items:flex-end;z-index:3}
.cvx-badges i{display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.cvx-badges svg{width:100%;height:100%;display:block}
.cvx-gfl{width:38px;height:38px}
.cvx-tl{width:52px;height:52px}
.cvx-vig{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 45%,transparent 55%,rgba(0,0,0,.45)),linear-gradient(0deg,rgba(0,0,0,.55),transparent 22%)}
.cvx-sheen{position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);transform:translateX(-120%);animation:cvsheen 1.6s 1.1s ease-in-out both}
@keyframes cvsheen{to{transform:translateX(120%)}}
/* per-style art direction */
.cvx-neon .cvx-title span{color:#FFFFFF;text-shadow:0 0 6px var(--c2),0 0 18px var(--c2),0 0 36px var(--c1)}
.cvx-neon .cvx-title b{color:transparent;-webkit-text-stroke:2.5px var(--c2);text-shadow:0 0 14px var(--c2)}
.cvx-neon .cvx-num{-webkit-text-stroke:2px var(--c2);opacity:.35;filter:drop-shadow(0 0 8px var(--c2))}
.cvx-shatter .cvx-title{text-align:left;left:5%;right:auto}
.cvx-shatter .cvx-title span{font-size:38px}
.cvx-shatter .cvx-title b{font-size:64px}
.cvx-shatter .cvx-num{right:auto;left:-3%;top:6%;opacity:.4}
.cvx-shatter .cvx-art{left:6%;right:-12%}
.cvx-stadium .cvx-title span{background:linear-gradient(#FFFFFF,#AEB8C4);-webkit-background-clip:text;background-clip:text;color:transparent}
.cvx-stadium .cvx-num{opacity:.25}
.cvx-pop .cvx-title{transform:rotate(-6deg);top:2%}
.cvx-pop .cvx-title span{color:#0A0D12;text-shadow:3px 3px 0 #FFFFFF}
.cvx-pop .cvx-title b{color:#FFFFFF;-webkit-text-stroke:3px #0A0D12;text-shadow:5px 5px 0 #0A0D12}
.cvx-pop .cvx-num{color:#0A0D12;-webkit-text-stroke:0;opacity:.18}
.cvx-pop .cvx-art{filter:drop-shadow(6px 6px 0 #0A0D12) drop-shadow(0 18px 20px rgba(0,0,0,.4))}
.cvx-gold .cvx-title span{background:linear-gradient(#FFF4D6,#E2B44F 60%,#A9781E);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;letter-spacing:.16em}
.cvx-gold .cvx-title b{color:transparent;background:linear-gradient(#FFF4D6,#E2B44F 60%,#A9781E);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:0;text-shadow:none}
.cvx-gold .cvx-num{-webkit-text-stroke:2px rgba(226,180,79,.6);opacity:.4}
.cvx-gold .cvx-art{filter:drop-shadow(0 0 16px rgba(226,180,79,.55)) drop-shadow(0 22px 26px rgba(0,0,0,.6))}
.cvx-blaze .cvx-title span{font-style:italic;transform:skewX(-8deg)}
.cvx-blaze .cvx-title b{font-style:italic}
/* player card under the cover */
.cov-card{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 12px;border:0;border-radius:14px;text-align:left;color:#F2EADA;font:inherit;background:linear-gradient(110deg,color-mix(in srgb,var(--tc) 55%,#0B0E14),#121821);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);animation:rise .6s .9s both;cursor:pointer}
.cov-cf{width:56px;height:56px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--tc),0 0 0 4px rgba(255,255,255,.15)}
.cov-cf svg{width:100%;height:100%;display:block}
.cov-cb{display:flex;flex-direction:column;min-width:0}
.cov-cb small{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.cov-cb b{font:800 22px var(--display);text-transform:uppercase;line-height:1.05}
.cov-cb em{font-style:normal;font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cov-co{display:flex;flex-direction:column;align-items:center}
.cov-co b{font:800 30px var(--display);line-height:1}
.cov-co small{font-size:10px;letter-spacing:.12em;opacity:.7}
.cov-why{animation:rise .6s 1.1s both}
.cov-why .eyebrow{color:#E2B44F}
.cov-why p{margin:6px 0 0;font-size:16px}
.btn.cov-btn{background:#E2B44F;color:#0A0D12;border-color:transparent;animation:rise .6s 1.3s both}
@keyframes covin{from{opacity:0;transform:perspective(900px) rotateY(-35deg) scale(.85)}
to{opacity:1;transform:none}}
@keyframes covface{from{opacity:0;transform:translateY(30px) scale(.9)}
to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.cov-box,.cov-face,.cov-why,.btn.cov-btn{animation:none}}
/* power */
.seg5 button{font-size:12.5px;letter-spacing:.02em;padding:8px 1px}
.tier{font-family:var(--display);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:14px 0 4px;border-bottom:1px solid var(--line)}
.pw{display:grid;grid-template-columns:24px 30px 30px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:10px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.pw.me{background:var(--accent-soft)}
.pw .rk{font-family:var(--display);font-weight:800;font-size:22px;text-align:right;font-variant-numeric:tabular-nums}
.pw .mv{font-family:var(--display);font-weight:700;font-size:12px;color:var(--muted);text-align:center}
.pw .mv.up{color:var(--win)}
.pw .mv.dn{color:var(--loss)}
.pw .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw .meta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovp{display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:44px;border-radius:9px;line-height:1}
.ovp b{font-family:var(--display);font-weight:800;font-size:22px}
.ovp span{font-family:var(--display);font-weight:700;font-size:9px;letter-spacing:.1em;opacity:.8}
.ovp.t0{background:var(--gold);color:#FFFFFF}
.ovp.t1{background:var(--accent);color:var(--accent-ink)}
.ovp.t2{background:var(--surface2);color:var(--ink)}
.ovp.t3{background:var(--surface2);color:var(--muted)}
@media (prefers-reduced-motion: reduce){.aw,.aw *,.pm *,.ms.elim,.ms.arrive,.ms.crown{animation:none!important}}
/* live game */
.live{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lv-bar{background:var(--surface);border-bottom:1px solid var(--line)}
.lv-bar .wrap{display:flex;gap:8px;align-items:center;padding-block:8px}
.lv-bar .seg{flex:1}
.lv-bar .btn{flex:none}
.board{background:var(--ink);color:var(--surface)}
.board .wrap{padding-block:12px 14px}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}

function save(){if(!G||G.user==null)return;

  try{const ug=allGames().filter(g=>g.plays);ug.slice(0,Math.max(0,ug.length-3)).forEach(g=>delete g.plays);put();return;}catch(e){}
  try{allGames().filter(g=>g.box&&g.id!==G.lastGame).forEach(g=>{delete g.box;delete g.plays;});(G.recaps||[]).splice(0,Math.max(0,(G.recaps||[]).length-4));put();return;}catch(e){}

}

/* ---- dead cap: one rule for every team, yours included ----
   Release a player under contract (above a minimum deal) and part of his salary stays on your cap:
   40% this season, then 20% in each of up to two later seasons. Trades and expiring deals leave nothing. */
const DEAD_NOW=.4,DEAD_LATER=.2,DEAD_MIN=1.5;
function deadSched(p){if(p.tid==null||!(p.yrs>0)||p.salary<=DEAD_MIN)return [];
  const after=G.phase==='done',y0=after?G.year+1:G.year,n=Math.min(3,after?p.yrs-1:p.yrs);   /* released after the season ends: that season is already paid */
  return Array.from({length:Math.max(0,n)},(_,i)=>({y:y0+i,amt:r2(p.salary*(i?DEAD_LATER:DEAD_NOW))}));}
/* what releasing p would free now, and leave behind later */
const deadNowOf=p=>{const d=deadSched(p);return d.length&&d[0].y===G.year?d[0].amt:0;},deadLaterOf=p=>r2(deadSched(p).reduce((t,x)=>t+(x.y>G.year?x.amt:0),0)),cutFree=p=>r2(p.salary-deadNowOf(p));
const deadCap=(tid,y)=>{y=y??G.year;return r2((G.dead||[]).reduce((s,d)=>s+(d.tid===tid&&d.y===y?d.amt:0),0));};
const deadList=tid=>{const m=new Map();(G.dead||[]).filter(d=>d.tid===tid&&d.y>=G.year).forEach(d=>{const k=d.pid??d.n;const o=m.get(k)||{n:d.n,pos:d.pos,now:0,later:0,last:d.y};if(d.y===G.year)o.now+=d.amt;else o.later+=d.amt;o.last=Math.max(o.last,d.y);m.set(k,o);});return [...m.values()].sort((a,b)=>b.now+b.later-a.now-a.later);};
const payroll=tid=>roster(tid).reduce((s,p)=>s+(p.yrs>0?p.salary:0),0)+deadCap(tid);
const nextYear=tid=>r2(roster(tid).reduce((s,p)=>s+(p.yrs>=2?p.salary:0),0)+deadCap(tid,G.year+1));
const capRoom=tid=>r2(capNow()-payroll(tid));

function askSalary(p){const t=Math.max(0,(p.ovr-55-salDrift())/44);let s=Math.pow(t,2.2)*POS[p.pos].max*SAL_K;if(p.age>=32)s*=0.8;if(p.age>=34)s*=0.8;return r2(clamp(0.75+s,0.75,capNow()*.22));}
/* salaries follow a player's standing in the league, not raw OVR, so the cap keeps the same buying power if ratings drift */
const salDrift=()=>G&&G.ovrBase?clamp((G.ovrNow??G.ovrBase+2.5)-(G.ovrBase+2.5),0,14):0;
function contractYears(p){return p.age<=26?ri(3,5):p.age<=30?ri(2,4):p.age<=32?ri(1,2):1;}
function posWeighted(){return wpick(POS_ORDER,POS_ORDER.map(k=>POS[k].n));}

function mkPlayer(pos,ovr,age){
  let f=pick(FIRST),l=pick(LAST);for(let k=0;k<6&&G.players.some(q=>q.l===l&&(q.f===f||k<2));k++){f=pick(FIRST);l=pick(LAST);}
  const p={id:G.nid++,f,l,pos,age,ovr:clamp(Math.round(ovr),35,99),tid:null,yrs:ri(1,4),s:blankStats()};
  p.pk=PEAK_BASE[pos]+ri(-1,2);
  p.pot=clamp(p.ovr+Math.round(Math.max(0,p.pk-age)*(.6+R()*2.6)),p.ovr,99);
  p.salary=askSalary(p);return p;
}
function genFA(pos,base){

function teamRatings(tid){
  if(RC&&RC.t.has(tid))return RC.t.get(tid);

  POS_ORDER.forEach(pos=>{const a=r.filter(p=>p.pos===pos).sort((x,y)=>y.ovr-x.ovr).slice(0,POS[pos].start);
    while(a.length<POS[pos].start)a.push({id:-1,f:'Practice',l:'Squad',pos,ovr:35});st1[pos]=a;});
  const o=pos=>avg(st1[pos].map(p=>p.ovr));
  const off=o('QB')*.34+o('OL')*.22+o('WR')*.22+o('RB')*.12+o('TE')*.10;
  const def=o('DL')*.30+o('LB')*.22+o('CB')*.28+o('S')*.20;
  const st=o('K')*.6+o('P')*.4;
  const res={off,def,st,ovr:off*.46+def*.44+st*.10,st1};if(RC)RC.t.set(tid,res);return res;

function makeSchedule(){
  const weeks=[];
  for(let c=0;c<2;c++){
    let arr=shuffle(G.teams.filter(t=>t.conf===c).map(t=>t.id));const n=arr.length;
    for(let r=0;r<n-1;r++){
      for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if((r+i)%2)[h,a]=[a,h];(weeks[r]=weeks[r]||[]).push({h,a});}
      arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
    }
  }
  /* balance venues: every team gets 7 or 8 home games (flip games from over-hosted to under-hosted teams) */
  const all=weeks.flat(),hc={};G.teams.forEach(t=>hc[t.id]=0);all.forEach(g=>hc[g.h]++);
  const lo=Math.floor(all.length/G.teams.length),hi=Math.ceil(all.length/G.teams.length);
  for(let guard=0;guard<500;guard++){
    const over=G.teams.map(t=>t.id).filter(id=>hc[id]>hi),under=G.teams.map(t=>t.id).filter(id=>hc[id]<lo);if(!over.length&&!under.length)break;
    let g=null;
    if(over.length){const x=over[0];g=all.find(q=>q.h===x&&hc[q.a]<lo)||all.find(q=>q.h===x&&hc[q.a]<hi);}
    else{const y=under[0];g=all.find(q=>q.a===y&&hc[q.h]>hi)||all.find(q=>q.a===y&&hc[q.h]>lo);}
    if(!g)break;hc[g.h]--;hc[g.a]++;[g.h,g.a]=[g.a,g.h];
  }
  return shuffle(weeks).map(w=>w.map(g=>({...g,id:G.gid++,played:false})));
}

const an=w=>(/^[aeiou]/i.test(w)?'an ':'a ')+w;
/* ===================== injuries & suspensions ===================== */
const out=p=>!!((p.inj&&p.inj.wks>0)||(p.sus&&p.sus.g>0));
const INJ_TYPES=[[1,['ankle sprain','bruised ribs','shoulder stinger','hamstring tightness','concussion']],[3,['hamstring strain','knee sprain','groin strain','rib fracture','concussion']],
  [6,['high ankle sprain','MCL sprain','broken hand','hamstring tear','shoulder separation']],[12,['broken collarbone','meniscus tear','broken fibula','Lisfranc sprain']],[99,['torn ACL','torn Achilles','broken leg','torn pectoral']]];

const tghC=new Map();
const tghOf=p=>{const k=p.id*100+p.age;if(!tghC.has(k))tghC.set(k,toughness(p));return tghC.get(k);};
function injure(p,fresh){
  const wks=wpick([1,2,3,4,6,8,12,99],[34,24,14,9,7,5,3,4]),t=pick(INJ_TYPES.find(x=>wks<=x[0])[1]);

  if(wks>=12&&p.pot>p.ovr&&R()<.5)p.pot=Math.max(p.ovr,p.pot-ri(1,wks>=99?5:3));   /* serious injuries can cost a young player part of his ceiling */
  (G.wkEv=G.wkEv||[]).push({k:'inj',pid:p.id,tid:p.tid,wks,t});
  if(p.tid===G.user)addNews(`${p.pos} ${fname(p)} suffered ${an(t)}${wks>=99?' and is out for the season':` and is out ${wks} week${wks===1?'':'s'}`}.`);
  return p.inj;
}
function suspend(p,fresh){
  const opts=SUSP.filter(s=>!s[2]||DEF_POS.includes(p.pos)),s=pick(opts),g=pick(s[1]);
  p.sus={why:s[0],g,y:G.year,fresh:!!fresh};p.susN=(p.susN||0)+1;
  (G.wkEv=G.wkEv||[]).push({k:'sus',pid:p.id,tid:p.tid,g,why:s[0]});
  addNews(`The league suspended ${p.pos} ${fname(p)} (${T(p.tid).abbr}) ${g} game${g===1?'':'s'} for ${s[0]}.`);
}
function randomSuspensions(prob){

function tickStatus(){

  R.sort((a,b)=>b.s-a.s);const why=R[0],why2=R[1];

    const gain=low?p.ovr-low.ovr:20;const sc=Math.min(gain,15)*1.3+(m==='contend'?18:m==='rebuild'?-12:0)+(room>=p.salary?6:-20)+pct(t)*30;return {t,low,room,m,gain,sc};}).filter(x=>x.gain>=3&&x.room>=p.salary*.6&&(!['lose','ring'].includes(why.k)||pct(x.t)>=.5)).sort((a,b)=>b.sc-a.sc);
  const top=S.slice(0,3);

  const sui=top.length?pickS(r,[`The most logical fits: ${top.map(sLine).join('; ')}.`,`Expect ${cn(top[0].t)} to call first. ${cap1(sLine(top[0]))}.${top[1]?` Keep an eye on ${cn(top[1].t)} too: it ${sLine(top[1]).slice(cn(top[1].t).length).replace(/^ \([^)]*\)/,'').trim()}.`:''}`]):`The market may be thin: few teams have both the need at ${p.pos} and the cap room to absorb ${money(p.salary)}.`;

  const head={lose:[`Tired of losing, ${fname(p)} asks out of ${tm.city}`,`${fname(p)} wants out of ${tm.city} after ${recStr(tm)} start`],role:[`${fname(p)} wants to start, and wants out of ${tm.city}`,`Buried on the depth chart, ${fname(p)} requests a trade`],money:[`Contract standoff: ${fname(p)} asks ${cn(tm)} for a trade`,`${fname(p)} wants to be paid, and wants out`],

  const gmQ={lose:[`We understand the frustration. We share it. That doesn't mean we give him away.`,`Every player in this building wants to win. So do I.`],role:[`He's a good player. Roles are earned here, and that's not changing.`,`We'll listen. But we like our depth chart.`],money:[`We have a contract. We'll honor it, and we expect him to as well.`,`Our door is open on an extension. It always has been.`],coach:[`New staffs take time. We'd like him to give it some.`,`Not everybody buys in right away. We'll see.`],rebuild:[`We're building something. He can be part of it or not.`,`Nobody is untouchable in a rebuild. That cuts both ways.`],ring:[`I respect where he is in his career. We'll do right by him if we can.`,`He's earned the right to ask. We've earned the right to say no.`],fresh:[`He's under contract. We'll do what's best for the team.`,`We're aware. Those conversations stay private.`]}[why.k];

}

/* ---------- playoff awareness helpers ---------- */
const wxGB=y=>(G.history||[]).find(h=>h.year===y)||null;

const AWARD_DEFS=[['mvp','Most Valuable Player'],['opoy','Offensive Player of the Year'],['dpoy','Defensive Player of the Year'],['roy','Rookie of the Year'],['cpoy','Comeback Player of the Year']];
const AWARD_SHORT={mvp:'MVP',opoy:'OPOY',dpoy:'DPOY',roy:'ROY',cpoy:'CPOY'};
const OFF_POS=['QB','RB','WR','TE'],DEF_POS=['DL','LB','CB','S'];
function prod(pos,s){const z=k=>s[k]||0;
  if(pos==='QB')return z('pY')/25+z('pT')*4-z('pI')*2+z('rY')/10+z('rT')*6;
  if(pos==='RB')return z('rY')/10+z('rT')*6+z('cY')/10+z('cT')*6;
  if(pos==='WR'||pos==='TE')return z('cY')/10+z('cT')*6+z('c')*.5;
  if(pos==='DL'||pos==='LB')return z('sk')*5+z('tk')*.6+z('dI')*6;
  if(pos==='CB'||pos==='S')return z('dI')*7+z('tk')*.6+z('sk')*4;

function awardLine(p,s){s=s||p.s;const z=k=>s[k]||0;

  if(p.pos==='WR'||p.pos==='TE')return `${z('c')} rec · ${z('cY').toLocaleString()} yds · ${z('cT')} TD`;

function computeAwards(){

  list.push({k:'dpoy',c:top3(pool.filter(p=>DEF_POS.includes(p.pos)&&p.id!==mv),p=>prod(p.pos,p.s)+teamRatings(p.tid).def*.05)});
  const first=G.year===G.recStart;

  list.push({k:'roy',c:top3(rookies,p=>prod(p.pos,p.s)*(DEF_POS.includes(p.pos)?1.2:1),p=>`${T(p.tid).abbr} · ${p.rk===G.year?(p.org&&p.org.t==='d'?`Drafted ${G.year} · Rd ${p.org.rd}, pick ${p.org.pk}`:`Undrafted ${G.year}`):'Age '+p.age}`)});
  const prevBy={},curBy={};
  G.players.forEach(p=>{const h=(p.hist||[]).find(x=>x.y===G.year-1);if(h&&(h.s.gp||0)>=8)(prevBy[p.pos]=prevBy[p.pos]||[]).push(prod(p.pos,h.s));
    if(p.tid!=null&&p.s.gp>=8)(curBy[p.pos]=curBy[p.pos]||[]).push(prod(p.pos,p.s));});

    const prev=prod(p.pos,last.s),now=prod(p.pos,p.s),hurt=(last.s.gp||0)<8;

    if(!L.length)return `<div class="recrow"><div class="eyebrow">${l}</div><div class="muted" style="font-size:14px;margin-top:4px">No record set yet.</div></div>`;

      ${L.length>1?`<ol class="recrest" start="2">${L.slice(1).map(e=>`<li><span class="${e.t===uab&&(sc!=='career'||e.active)?'mine':''}">${e.n}</span> <span class="muted">${sc==='game'?e.t+" '"+String(e.y).slice(2):sc==='season'?e.t+" '"+String(e.y).slice(2):e.active?e.t:'Ret.'}</span><b>${e.v.toLocaleString()}</b></li>`).join('')}</ol>`:''}</div>`;}).join('');

  const pm=new Map(G.players.map(p=>[p.id,p])),A=G.awards&&G.awards[G.year-1],win=k=>A&&A.revealed&&A.list.find(a=>a.k===k)?.win;

  const moved=new Set((G.tx||[]).filter(x=>x.y===G.year&&x.ph!=='regular').flatMap(x=>x.k==='trade'?[...x.ga.pl,...x.gb.pl].map(q=>q.id):[x.pid]));
  const recs=new Set(Object.values(G.rec.season||{}).flatMap(L=>L.filter(e=>e.y===G.year-1).map(e=>e.pid)));
  const cands=G.players.filter(p=>p.tid!=null&&!['K','P','OL'].includes(p.pos)).sort((a,b)=>b.ovr-a.ovr).slice(0,40).map(p=>{
    const r=[];let s=p.ovr+(p.pos==='QB'?3:0);
    const prevC=G.cover[G.year-1],times=Object.values(G.cover).filter(c=>c.pid===p.id).length;if(prevC&&prevC.pid===p.id)s-=R()<.85?30:0;s-=times*4;
    if(win('mvp')===p.id){s+=9;r.push(`won MVP last season`);}
    else if(win('opoy')===p.id||win('dpoy')===p.id){s+=5;r.push(`was named ${win('opoy')===p.id?'Offensive':'Defensive'} Player of the Year`);}

    if(recs.has(p.id)){s+=3;r.push('set a league record last season');}
    if(moved.has(p.id)&&p.ovr>=80){s+=4;r.push(`joined ${cn(T(p.tid))} this offseason`);}
    if(p.age>=34&&p.ovr>=80){s+=3;r.push('is playing what could be his final season');}

  return G.cover[G.year];
}

function fxConfetti(colors,amt){const cv=$('fx');if(!cv)return;cv.style.display='block';confetti(cv,colors,amt);setTimeout(()=>{cv.style.display='none';},6300);}
function confetti(cv,colors,amt){amt=amt||1;
  try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
  const ctx=cv.getContext('2d');if(!ctx)return;const dpr=window.devicePixelRatio||1;
  const W=cv.width=cv.offsetWidth*dpr,H=cv.height=cv.offsetHeight*dpr;
  const parts=[];const burst=(n,x)=>{for(let i=0;i<n;i++)parts.push({x:x*W,y:H*.38,vx:(R()-.5)*W*.022,vy:-(R()*H*.022+H*.006),g:H*.00045,r:R()*6,vr:(R()-.5)*.3,w:(5+R()*5)*dpr,h:(9+R()*7)*dpr,c:colors[i%colors.length]});};
  /* a steady three-second stream raining down from the top of the screen (no bursts) */
  const drop=n=>{for(let i=0;i<n;i++)parts.push({x:R()*W,y:-R()*H*.05-10,vx:(R()-.5)*W*.002,vy:R()*H*.004+H*.003,g:H*.00004,r:R()*6,vr:(R()-.5)*.25,w:(5+R()*5)*dpr,h:(9+R()*7)*dpr,c:colors[i%colors.length]});};
  for(let k=0;k<30;k++)setTimeout(()=>drop(Math.round(16*amt)),k*100);
  const t0=performance.now();
  (function f(now){if(!cv.isConnected)return;ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{p.vy+=p.g;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*1.5)));ctx.restore();});
    parts.splice(0,parts.length,...parts.filter(p=>p.y<H+40));if(now-t0<6000)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H);})(t0);
}
