    case 'replay':openLive(id);break;
    case 'liveSpeed':UI.live.speed=UI.liveSpeed=+v;if(UI.live.playing)schedLive(250);break;
    case 'liveReplay':{const L0=UI.live;if(!L0)break;clearTimeout(liveTimer);const sp=L0.speed;openLive(L0.gid);if(UI.live)UI.live.speed=sp;break;}
    case 'livePause':{const g0=liveGame();if(!UI.live.playing&&g0&&g0.neutral&&UI.live.idx===0&&!UI.live.fly){UI.live.fly=1;UI.live.playing=true;setTimeout(flyover,30);schedLive(3300);break;}}UI.live.playing=!UI.live.playing;if(UI.live.playing)schedLive(250);else clearTimeout(liveTimer);break;
    case 'liveSkip':{const g=liveGame();UI.live.idx=g.plays.length;UI.live.playing=false;clearTimeout(liveTimer);break;}
    case 'liveClose':UI.live=null;clearTimeout(liveTimer);window.scrollTo(0,0);break;
    case 'liveTab':UI.live.tab=v;$('lvBody')&&($('lvBody').scrollTop=0);break;
    case 'liveTeam':UI.live.team=+v;break;
    case 'simReg':{let n=0;while(G.phase==='regular'&&n++<20){if(playWeek()===false)break;}break;}
    case 'playRound':{if(G.phase!=='playoffs'||!G.po||awardsPending())break;if(poBlocked())break;const lg=G.lastGame;playRound();if(G.lastGame!==lg)qsFlash(G.lastGame);break;}
    case 'simPO':UI.toBracket=1;while(G.phase==='playoffs'&&!awardsPending()&&!poBlocked())playRound();break;
    case 'startOff':if(G.phase!=='done')break;UI.poAnim=null;UI.poMoment=null;UI.poFresh=false;startOffseason();afterResign();window.scrollTo(0,0);break;
    case 'letgo':{const p=G.players.find(x=>x.id===id);addNews(`Let ${p.pos} ${fname(p)} walk.`);toFA(p);afterResign();break;}
    case 'negOpen':{const p=G.players.find(x=>x.id===id);if(!p)break;
      if(p.tid===null){if(['draft','fa','resign'].includes(G.phase))break;if(p.spurn){toast(`${fname(p)} left your team for a change of scenery and won't sign with you.`);break;}if(!p.neg||(p.neg.fa&&!p.neg.tries))negInitFA(p);if(p.neg.closed){toast(`${fname(p)} is not interested in your team.`);break;}}
      if(!p.neg)break;if(p.neg.leave){toast(`${fname(p)} wants a change of scenery and will not re-sign.`);break;}openSheet({type:'neg',id,amt:p.neg.d,yrs:p.neg.y});break;}
    case 'negSubmit':negSubmit(id);break;
    case 'negReset':{const p=G.players.find(x=>x.id===id);if(p&&p.neg&&UI.sheet){UI.sheet.amt=p.neg.d;UI.sheet.yrs=p.neg.y;}break;}
    case 'toFA':if(G.phase!=='resign')break;startFA();window.scrollTo(0,0);break;
    case 'faOffer':{const fp=G.players.find(x=>x.id===id);if(fp&&fp.spurn){toast(`${fname(fp)} won't sign with you after asking out.`);break;}userOffer(id,+k);break;}
    case 'faWithdraw':G.fae.offers=G.fae.offers.filter(o=>!(o.tid===G.user&&o.pid===id));break;
    case 'faSubmit':if(!armed('fa'))break;resolveFA();UI.sheet=null;UI.faSpin=G.year;window.scrollTo(0,0);break;
    case 'faDone':if(G.phase!=='fa')break;goToDraft();window.scrollTo(0,0);break;
    case 'faAll':UI.faAll=!UI.faAll;break;
    case 'teamTab':if(UI.sheet)UI.sheet.tt=v;break;
    case 'draft':if(G.draft.order[G.draft.idx]===G.user){draftPlayer(G.user,id);if(G.phase==='draft')showPick();}break;
    case 'simToPick':clearTimeout(draftTimer);UI.dLive=false;UI.dReveal=null;simToUserPick();break;
    case 'autoDraft':if(!armed('ad'))break;clearTimeout(draftTimer);UI.dLive=false;autoDraftAll();break;
    case 'draftLive':draftLiveToggle();break;
    case 'kickoff':kickoff();window.scrollTo(0,0);break;
    case 'chip':UI[k]=v;break;
    case 'seg':UI.league=v;break;
    case 'player':openSheet({type:'player',id});break;
    case 'game':openSheet({type:'game',id});break;
    case 'drTab':UI.drTab=v;break;
    case 'deadlineGo':UI.tab='market';UI.market='trade';UI.tview='block';UI.sheet=null;UI.sheetStack=[];window.scrollTo(0,0);break;
    case 'book':openSheet({type:'book',id});break;
    case 'bkTab':if(UI.sheet)UI.sheet.bt=v;break;
    case 'bkSide':if(UI.sheet)UI.sheet.ps=+v;break;
    case 'team':UI.teamPos='All';openSheet({type:'team',id});break;
    case 'close':UI.sheetBack=!!(UI.sheet&&UI.sheetStack.length);UI.sheet=UI.sheetStack.pop()||null;break;
    case 'release':if(UI.sheet&&UI.sheet.type==='player'&&UI.sheet.id===id)UI.sheet.confirm=true;else UI.sheet={type:'player',id,confirm:true};break;
    case 'releaseNo':if(UI.sheet&&UI.sheet.type==='player')UI.sheet.confirm=false;break;   /* just close the question; the player page is already open */
    case 'releaseYes':{const p=G.players.find(x=>x.id===id),dd=deadSched(p).reduce((t,x)=>t+x.amt,0);addNews(`Released ${p.pos} ${fname(p)}${dd?` (${money(r2(dd))} dead cap)`:''}.`);logTx({k:'release',tid:G.user,pid:p.id,txt:`${cn(T(G.user))} released ${p.pos} ${fname(p)} (${p.ovr}).`});G.block=(G.block||[]).filter(x=>x!==p.id);toFA(p,.85);UI.sheet=null;toast(`${fname(p)} released.`);break;}
    case 'sign':{const p=G.players.find(x=>x.id===id);if(!p||p.tid!==null)break;
      if(G.phase==='fa'){toast('During free agency, make an offer instead.');break;}
      if(G.phase==='resign'){toast('Free agents can be signed once free agency opens.');break;}
      if(G.phase==='draft'){toast('Signings pause during the draft.');break;}
      if(roster(G.user).length>=RMAX+(G.phase==='regular'?0:12)){toast('Your roster is full. Release someone first.');break;}
      if(p.ask>capRoom(G.user)){toast(`Not enough cap room. You need ${money(p.ask)}.`);break;}
      sign(p,G.user);addNews(`Signed ${p.pos} ${fname(p)}: ${money(p.salary)} × ${p.yrs} yr.`);UI.sheet=null;toast(`${fname(p)} signed.`);break;}
    case 'offer':{const p=G.players.find(x=>x.id===id);if(!UI.trade.mine.includes(id))UI.trade.mine.push(id);UI.sheet=null;UI.tab='market';UI.market='trade';window.scrollTo(0,0);break;}
    case 'ask':{UI.tside='theirs';UI.tview='make';const p=G.players.find(x=>x.id===id);if(UI.trade.tid!==p.tid){UI.trade.tid=p.tid;UI.trade.theirs=[];}if(!UI.trade.theirs.includes(id))UI.trade.theirs.push(id);UI.sheet=null;UI.tab='market';UI.market='trade';window.scrollTo(0,0);break;}
    case 'tradeWith':UI.trade.tid=id;UI.trade.theirs=[];UI.trade.theirsP=[];UI.tview='make';UI.sheet=null;UI.tab='market';UI.market='trade';window.scrollTo(0,0);break;
    case 'tgl':{const arr=UI.trade[k],i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);break;}
    case 'tglp':{const arr=UI.trade[k+'P']=UI.trade[k+'P']||[],i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);break;}
    case 'tview':UI.tview=v;break;
    case 'txf':UI.txf=v;break;
    case 'txAll':UI.txAll=!UI.txAll;break;
    case 'txOpen':openSheet({type:'tx',id});break;
    case 'blockToggle':{G.block=G.block||[];const i=G.block.indexOf(id);if(i<0&&!tradeOpen()){toast('The trade block is closed until the offseason.');break;}if(i>=0){G.block.splice(i,1);G.offers=(G.offers||[]).filter(o=>o.pid!==id);toast('Taken off the trade block.');}
      else{G.block.push(id);const os=blockOffers(id);G.offers=(G.offers||[]).filter(o=>o.pid!==id).concat(os);toast(os.length?`${os.length} team${os.length===1?'':'s'} made an offer.`:'On the block. No offers yet.');}break;}
    case 'acceptOffer':acceptOffer(id);break;
    case 'getOffers':{const p=G.players.find(x=>x.id===id);if(!p||p.tid!==G.user||!tradeOpen())break;UI.offCache=UI.offCache||{};const ck=offKey()+'|'+id;
      if(!UI.offCache[ck])UI.offCache[ck]=cached(()=>blockOffers(id,8));const offs=UI.offCache[ck].filter(o=>!(o.gone));rememberOffers(offs);openSheet({type:'offers',pid:id,offers:offs.slice()});break;}
    case 'offAccept':{const S=UI.sheet;if(!S||S.type!=='offers')break;const o=S.offers[id];if(acceptOffer(null,o)){UI.sheet=null;UI.sheetStack=[];}break;}
    case 'offDecline':{const S=UI.sheet;if(S&&S.type==='offers'){const o=S.offers[id];if(o)o.gone=1;S.offers.splice(id,1);}break;}
    case 'offCounter':{const S=UI.sheet;if(!S||S.type!=='offers')break;const o=S.offers[id];Object.assign(UI.trade,{tid:o.tid,mine:[o.pid],theirs:o.pl.slice(),mineP:[],theirsP:o.pk.slice()});UI.sheet=null;UI.sheetStack=[];UI.tab='market';UI.market='trade';UI.tview='make';UI.tside='theirs';window.scrollTo(0,0);break;}
    case 'declineOffer':G.offers.splice(id,1);break;
    case 'counterOffer':{const o=G.offers[id];if(!o)break;Object.assign(UI.trade,{tid:o.tid,mine:[o.pid],theirs:o.pl.slice(),mineP:[],theirsP:o.pk.slice()});UI.tview='make';UI.tside='theirs';window.scrollTo(0,0);break;}
    case 'propose':proposeTrade();break;
    case 'clearTrade':Object.assign(UI.trade,{mine:[],theirs:[],mineP:[],theirsP:[]});break;
    case 'newGame':UI.confirmNew=true;break;
    case 'newNo':UI.confirmNew=false;break;
    case 'newYes':case 'newSame':{const keep=a==='newSame'?G.user:null;
      try{localStorage.removeItem(KEY);}catch(e){}
      Object.assign(UI,{confirmNew:false,trade:{tid:null,mine:[],theirs:[]},sheet:null,tab:'home',poAnim:null,poMoment:null,poFresh:false,live:null,awOpen:false,recapSel:null});
      clearTimeout(liveTimer);generateLeague();
      if(keep!=null){G.user=keep;addNews(`Hired as general manager of the ${T(keep).city} ${T(keep).name}.`);}
      window.scrollTo(0,0);break;}
  }
  save();render();
}
function migrateSave(){
  try{syncHistOvr();}catch(e){}
  if(G.dead&&G.dead.some(d=>d.y==null))G.dead=G.dead.flatMap(d=>d.y!=null?[d]:Array.from({length:d.yrs||0},(_,i)=>({tid:d.tid,pid:null,n:'',pos:'',y:G.year+i,amt:d.amt})));
  /* fix venue balance in a season already underway: flip unplayed games only */
  if(G.phase==='regular'&&G.sched&&!G.venueFix){G.venueFix=G.year;const all=G.sched.flat(),hc={};G.teams.forEach(t=>hc[t.id]=0);all.forEach(g=>hc[g.h]++);
    const lo=Math.floor(all.length/G.teams.length),hi=Math.ceil(all.length/G.teams.length),open=all.filter(g=>!g.played);
    for(let guard=0;guard<500;guard++){const over=G.teams.map(t=>t.id).filter(id=>hc[id]>hi),under=G.teams.map(t=>t.id).filter(id=>hc[id]<lo);if(!over.length&&!under.length)break;
      let g=null;if(over.length){const x=over[0];g=open.find(q=>q.h===x&&hc[q.a]<lo)||open.find(q=>q.h===x&&hc[q.a]<hi);}else{const y=under[0];g=open.find(q=>q.a===y&&hc[q.h]>hi)||open.find(q=>q.a===y&&hc[q.h]>lo);}
      if(!g)break;hc[g.h]--;hc[g.a]++;[g.h,g.a]=[g.a,g.h];}}
  if(G.scor)scorFix();if(!G.scor){G.scor={};G.scorY=G.year;G.scorSeqOK=1;allGames().filter(g=>g.played).forEach(g=>{const hi=Math.max(g.as,g.hs),lo=Math.min(g.as,g.hs),e=G.scor[hi+'-'+lo]||(G.scor[hi+'-'+lo]={n:0,L:[]});e.n++;e.L.unshift([G.year,g.neutral?CUP:g.conf!=null?'Playoffs':'Regular season',g.w,g.l,g.ot?1:0,g.id]);});}
  G.block=[];G.offers=[];
  G.hof=G.hof||[];staffInit();if(G.rlY==null)G.rlY=G.year;
  G.players.forEach(p=>{p.s=Object.assign(blankStats(),p.s);});G.recaps=G.recaps||[];initRec();migrateTeams();G.awards=G.awards||{};
  if(G.phase==='fa'&&!G.fae)G.phase='final';
  if(G.capV!==2){G.capV=2;G.teams.forEach(t=>{t.dead=0;});
    G.players.forEach(p=>{if(p.salary)p.salary=r2(clamp(.75+(p.salary-.75)*SAL_K,.75,SAL_MAX));if(p.ask)p.ask=askSalary(p);});
    G.teams.forEach(t=>{if(payroll(t.id)>capNow())fitCap(t.id,capNow()-2);});
    if(G.phase==='resign')G.teams.forEach(t=>roster(t.id).filter(p=>p.yrs<=0).forEach(p=>negInit(p,t.id)));}
  const ex=expandLeague();ensurePicks();try{ensureGMs();}catch(e){}G.block=G.block||[];G.offers=G.offers||[];G.tx=G.tx||[];
  G.players.forEach(p=>{ensureDev(p);if(!p.org)guessOrigin(p,p.tid);});if(G.draft)G.draft.pros.forEach(ensureDev);
  return ex;
}
function boot(data){
  if(data&&data.G){G=data.G;Object.assign(UI,data.UI||{});}else G=load();
  if(!G)generateLeague();
  const expanded=migrateSave();
  if(UI.live&&UI.live.playing)schedLive(800);
  document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;act(el.dataset.act,el.dataset.v,el.dataset.k,el);});
  document.addEventListener('input',e=>{if(e.target.id==='gmF'){UI.gmF=e.target.value;return;}if(e.target.id==='gmL'){UI.gmL=e.target.value;return;}const S=UI.sheet;if(!S||S.type!=='neg')return;if(e.target.id==='negAmt'){S.amt=r2(+e.target.value);updateNeg();}else if(e.target.id==='negYrs'){S.yrs=+e.target.value;updateNeg();}});
  document.addEventListener('change',e=>{if(e.target.id==='importFile'){importSaveFile(e.target.files&&e.target.files[0]);return;}if(e.target.id==='tradeTeam'){UI.trade.tid=+e.target.value;UI.trade.theirs=[];UI.trade.theirsP=[];render();}});
  render();if(expanded){save();toast('The league expanded to 32 teams.');}
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>({G,UI}));
}
if(typeof document!=='undefined'){
  const h=window.claude&&window.claude.hot;
  if(h&&h.ready)h.ready(boot);else boot(h&&h.data||{});
}
</script>
